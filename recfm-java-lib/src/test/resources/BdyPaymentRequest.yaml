defaults:
  fil:
    fill: ' '
packages:
  - name: it.insur.recfm
    interfaces:
      - &PostalAddress
        name: IPostalAddress
        len: 800
        fields:
          - !Grp { name: adrTp      , fields: [
              !Abc { name: cd       , len:  4 },
              !Abc { name: id       , len:  4 },
              !Abc { name: issr     , len: 35 },
              !Abc { name: schmeNm  , len: 35 }
          ] }
          - !Abc { name: dept       , len: 70}
          - !Abc { name: subDept    , len: 70 }
          - !Abc { name: strtNm     , len: 70 }
          - !Abc { name: bldgNb     , len: 16 }
          - !Abc { name: bldgNm     , len: 35 }
          - !Abc { name: flr        , len: 70 }
          - !Abc { name: pstBx      , len: 16 }
          - !Abc { name: room       , len: 70 }
          - !Abc { name: pstCd      , len: 16 }
          - !Abc { name: twnNm      , len: 35 }
          - !Abc { name: twnLctnNm  , len: 35 }
          - !Abc { name: dstrctNm   , len: 35 }
          - !Abc { name: ctrySubDvsn, len: 35 }
          - !Abc { name: ctry       , len:  2 }
          - !Abc { name: adrLine1   , len: 70 }
          - !Abc { name: adrLine2   , len: 70 }
          - !Fil {                    len:  7 }

    classes:
      - name: PayInfo10
        # len: 1631
        fields:
          - !Val { val: "A10"       , len:  3 } # discriminator
          - !Abc { name: keyId      , len: 27 }
          - !Grp { name: header     , fields: [   # 1.*
              !Abc { name: msgId    , len: 35 },  # 1.1
              !Abc { name: creDtTm  , len: 23 },  # 1.2
              !Abc { name: nbOfTxs  , len: 15 },  # 1.3
              !Abc { name: ctrlSum  , len: 18 },  # 1.4
              !Grp { name: initgPty , fields: [   # 1.5.*
                !Abc { name: nm     , len: 70 },  # 1.5.1
                !Occ { name: othr   , times: 5, fields: [
                  !Abc { name: id   , len: 35}, # 1.5.2.1.1.1
                  !Abc { name: issr , len: 35}  # 1.5.2.1.1.2
                ]}
              ]}
            ]}
          - !Abc { name: pmtInfId   , len: 35 } # 2.1
          - !Abc { name: pmtMtd     , len:  3 } # 2.2 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:PmtMtd/text()
          - !Abc { name: cd         , len:  4 } # 2.4.2.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:PmtTpInf/PMRQ:SvcLvl/PMRQ:Cd/text()
          - !Abc { name: dt         , len: 10 } # 2.5.1
          - !Grp { name: dbtr       , fields: [
              !Abc { name: nm       , len: 70}, # 2.6.1
              !GRP { name: pstlAdr  , as: *PostalAddress }, # 2.6.2
              !Abc { name: anyBIC   , len: 11}, # 2.6.3.1..1
              !Abc { name: LEI      , len: 20}, # 2.6.3.1..2
              !Abc { name: id       , len: 35}, # 2.6.3.1..3.1
              !Abc { name: issr     , len: 35}, # 2.6.3.1..3.2
          ]}
          - !Grp { name: dbtrAgt    , fields: [
              !Abc { name: BICFI    , len: 11}, # 2.8.1.1
              !Abc { name: mmbId    , len: 35}, # 2.8.1.2
              !Abc { name: LEI      , len: 20}  # 2.8.1.3
            ]}
          - !Fil {                    len:  1 }

      - name: PayInfo20
        len: 150
        fields:
          - !Val { val: "A20"       , len:  3 } # discriminator
          - !Abc { name: instrId    , len: 35 } # 2.12.1.1
          - !Abc { name: endToEndId , len: 35 } # 2.12.1.2
          - !Abc { name: ccy        , len:  3 } # 2.12.3.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Amt/PMRQ:InstdAmt/@Ccy
          - !Abc { name: amt        , len: 12 } # 2.12.3.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Amt/PMRQ:InstdAmt/text()
          - !Abc { name: srvInf     , len:  5 } # 2.12.6   ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/SrvInf/text()
          - !Abc { name: idCdtr     , len: 16 } # 2.12.8.3.1.3.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:Id/PMRQ:OrgId/PMRQ:Othr/PMRQ:Id/text()
          - !Abc { name: issrCdtr   , len:  3 } # 2.12.8.3.1.3.2 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:Id/PMRQ:OrgId/PMRQ:Othr/PMRQ:Issr/text()
          - !Abc { name: iban       , len: 34 } # 2.12.9 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:CdtrAcct/text()
          - !Fil {                    len:  4 }

      - name: PayInfo30
        len: 80
        fields:
          - !Val { val: "A30"       , len:  3 } # discriminator
          - !Abc { name: ustrd      , len: 18 } # 2.12.17.1 18 o 140 ?! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:RmtInf/PMRQ:Ustrd/text()
          - !Fil {                    len: 59 }

      - name: PayInfo
        len: 140
        fields:
          - !Abc { name: keyId      , len: 27 }
          - !Abc { name: pmtMtd     , len:  3 } # 2.2 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:PmtMtd/text()
          - !Abc { name: cd         , len:  4 } # 2.4.2.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:PmtTpInf/PMRQ:SvcLvl/PMRQ:Cd/text()
          - !Abc { name: ccy        , len:  3 } # 2.12.3.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Amt/PMRQ:InstdAmt/@Ccy
          - !Abc { name: amt        , len: 12 } # 2.12.3.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Amt/PMRQ:InstdAmt/text()
          - !Abc { name: srvInf     , len:  5 } # 2.12.6   ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/SrvInf/text()
          - !Abc { name: idCdtr     , len: 16 } # 2.12.8.3.1.3.1 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:Id/PMRQ:OrgId/PMRQ:Othr/PMRQ:Id/text()
          - !Abc { name: issrCdtr   , len:  3 } # 2.12.8.3.1.3.2 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:Id/PMRQ:OrgId/PMRQ:Othr/PMRQ:Issr/text()
          - !Abc { name: iban       , len: 34 } # 2.12.9 ! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:CdtrAcct/text()
          - !Abc { name: ustrd      , len: 18 } # 2.12.17.1 18 o 140 ?! /BODY:CBIBdyPaymentRequest/BODY:CBIEnvelPaymentRequest/BODY:CBIPaymentRequest/PMRQ:PmtInf/PMRQ:CdtTrfTxInf/PMRQ:Cdtr/PMRQ:RmtInf/PMRQ:Ustrd/text()
          - !Fil {                    len: 15 }
          - !Abc { name: reset1, at:  35, len: 106, ovr: yes }
          - !Abc { name: reset2, at: 108, len:  33, ovr: yes }


      - name: test
        #len: 412
        fields:
          - !Abc { name: keyId      , len: 27 }
          - !Occ { name: othr   , times: 5, fields: [
              !Abc { name: id   , len: 35}, # 1.5.2.1.1.1
              !Abc { name: issr , len: 35}  # 1.5.2.1.1.2
            ]}
          - !Abc { name: pmtInfId   , len: 35 } # 2.1
